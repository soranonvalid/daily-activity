name: Daily Activity

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Make random changes and push
        run: |
          git config user.name "soranonvalid"
          git config user.email "soraunordinary@gmail.com"
          
          git pull --rebase origin HEAD || true
          
          COMMITS=$((1 + RANDOM % 3))
          
          for i in $(seq 1 $COMMITS); do
            echo "$(date -u) - Entry $RANDOM" >> log.txt
            git add log.txt
            git commit -m "chore: update log ($i/$COMMITS)"
          done
          
          git push origin HEAD
